<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | SportNutrition</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <img src="images/logo.png" alt="SportNutrition">
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="cart.html">Корзина</a></li>
                    <li><a href="login.html" class="active">Войти</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="auth">
            <div class="container">
                <div class="auth-container">    
                    <div class="auth-content">
                        <div class="tab-content active" id="login">
                            <h2>Вход в аккаунт</h2>
                            <form id="login-form">
                                <div class="form-group">
                                    <label for="login-email">Email</label>
                                    <input type="email" id="login-email" required>
                                </div>
                                <div class="form-group">
                                    <label for="login-password">Пароль</label>
                                    <input type="password" id="login-password" required>
                                </div>
                                <button type="submit" class="btn">Войти</button>
                                <div class="auth-links">
                                    <a href="#" id="forgot-password">Забыли пароль?</a>
                                </div>
                            </form>
                        </div>
                        
                        <div class="tab-content" id="register">
                            <h2>Регистрация</h2>
                            <form id="register-form">
                                <div class="form-group">
                                    <label for="reg-name">ФИО</label>
                                    <input type="text" id="reg-name" required>
                                </div>
                                <div class="form-group">
                                    <label for="reg-email">Email</label>
                                    <input type="email" id="reg-email" required>
                                </div>
                                <div class="form-group">
                                    <label for="reg-phone">Телефон</label>
                                    <input type="tel" id="reg-phone" required>
                                </div>
                                <div class="form-group">
                                    <label for="reg-password">Пароль</label>
                                    <input type="password" id="reg-password" required>
                                </div>
                                <div class="form-group">
                                    <label for="reg-confirm">Подтверждение пароля</label>
                                    <input type="password" id="reg-confirm" required>
                                </div>
                                <button type="submit" class="btn">Зарегистрироваться</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 SportNutrition. Все права защищены.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
